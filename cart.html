<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your Cart - Nessa's Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Your Cart</h1>
        <div id="cart-root" class="small-container cart-page">
            <p id="empty-msg">Your cart is empty.</p>
            <table id="cart-table" style="width:100%; display:none; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left">Product</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cart-body"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" style="text-align:right">Total:</td>
                        <td id="cart-total">#0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
            <div id="cart-actions" style="margin-top:16px; display:none;">
                <button id="clear-cart" class="btn">Clear cart</button>
                <button id="checkout" class="btn">Checkout</button>
            </div>
        </div>
    </div>

    <script>
    (function(){
        function readCart(){ try{ return JSON.parse(localStorage.getItem('cart')||'[]'); }catch(e){ return []; } }
        function writeCart(cart){ localStorage.setItem('cart', JSON.stringify(cart)); }
        function formatPrice(n){ return '#' + (n || 0).toLocaleString(); }

        function render(){
            var cart = readCart();
            var emptyMsg = document.getElementById('empty-msg');
            var table = document.getElementById('cart-table');
            var body = document.getElementById('cart-body');
            var totalEl = document.getElementById('cart-total');
            var actions = document.getElementById('cart-actions');

            if(!cart || cart.length === 0){ emptyMsg.style.display = 'block'; table.style.display = 'none'; actions.style.display = 'none'; return; }
            emptyMsg.style.display = 'none'; table.style.display = 'table'; actions.style.display = 'block';
            body.innerHTML = '';
            var total = 0;
            cart.forEach(function(item, idx){
                var tr = document.createElement('tr');
                var tdProduct = document.createElement('td'); tdProduct.style.display = 'flex'; tdProduct.style.alignItems = 'center';
                var img = document.createElement('img'); img.src = item.image || ''; img.style.width='60px'; img.style.marginRight='10px';
                var name = document.createElement('div'); name.textContent = item.name;
                tdProduct.appendChild(img); tdProduct.appendChild(name);

                var tdPrice = document.createElement('td'); tdPrice.textContent = formatPrice(item.price);
                var tdQty = document.createElement('td');
                var qtyInput = document.createElement('input'); qtyInput.type='number'; qtyInput.min='1'; qtyInput.value = item.quantity || 1; qtyInput.style.width='60px';
                qtyInput.addEventListener('change', function(){ var v = parseInt(qtyInput.value) || 1; item.quantity = v; cart[idx] = item; writeCart(cart); render(); updateBadge(); });
                tdQty.appendChild(qtyInput);

                var tdSub = document.createElement('td'); var subtotal = (item.price || 0) * (item.quantity || 1); tdSub.textContent = formatPrice(subtotal);
                total += subtotal;

                var tdRemove = document.createElement('td'); var rem = document.createElement('button'); rem.className = 'btn'; rem.textContent = 'Remove';
                rem.addEventListener('click', function(){ cart.splice(idx,1); writeCart(cart); render(); updateBadge(); });
                tdRemove.appendChild(rem);

                tr.appendChild(tdProduct); tr.appendChild(tdPrice); tr.appendChild(tdQty); tr.appendChild(tdSub); tr.appendChild(tdRemove);
                body.appendChild(tr);
            });
            totalEl.textContent = formatPrice(total);
        }

        function updateBadge(){
            // update any cart-count element in this document (if present)
            var countEl = document.getElementById('cart-count');
            var cart = readCart(); var totalQty = cart.reduce(function(s,i){ return s + (i.quantity||0); }, 0);
            if(countEl) countEl.textContent = totalQty;
        }

        document.getElementById('clear-cart').addEventListener('click', function(){ if(confirm('Clear cart?')){ writeCart([]); render(); updateBadge(); } });
        document.getElementById('checkout').addEventListener('click', function(){ alert('Checkout placeholder — implement server-side checkout.'); });

        render(); updateBadge();
    })();
    </script>
</body>
</html>
