<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Nessa's Fit account">
  <meta name="theme-color" content="#ff523b">
  <title>Sign In — Nessa's Fit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" role="banner">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <a href="index.html" class="navbar__logo" aria-label="Nessa's Fit home">
        <img src="images/Screenshot_22-10-2025_114914_stock.adobe.com.jpeg" width="125" alt="Nessa's Fit">
      </a>
      <ul class="navbar__menu" id="MenuItems">
        <li><a href="index.html" class="navbar__link">Home</a></li>
        <li><a href="product.html" class="navbar__link">Products</a></li>
        <li><a href="about.html" class="navbar__link">About</a></li>
        <li><a href="contact.html" class="navbar__link">Contact</a></li>
        <li><a href="login.html" class="navbar__link">Sign In</a></li>
      </ul>
      <a href="cart.html" class="cart-link" aria-label="Shopping cart">
        <img src="images/Screenshot_22-10-2025_115018_www.bing.com.jpeg" width="30" height="30" alt="Cart">
        <span class="cart-count" id="cart-count" aria-hidden="true">0</span>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <img src="images/icon.jpg" alt="">
      </button>
    </nav>
  </header>

  <main>
    <div class="container" style="max-width: 600px; margin: var(--spacing-2xl) auto;">
      <section>
        <h1>Sign In to Your Account</h1>
        <form id="loginForm" method="post" novalidate>
          <div class="form-group" style="margin-bottom: var(--spacing-lg);">
            <label for="email" style="display: block; margin-bottom: var(--spacing-sm); font-weight: 600;">Email Address</label>
            <input
              id="email"
              name="email"
              type="email"
              class="input"
              placeholder="your@email.com"
              required
              autocomplete="email"
              aria-describedby="email-hint"
            />
            <small id="email-hint" style="display: block; margin-top: var(--spacing-xs); color: var(--text-muted);">We'll never share your email</small>
          </div>

          <div class="form-group" style="margin-bottom: var(--spacing-lg);">
            <label for="password" style="display: block; margin-bottom: var(--spacing-sm); font-weight: 600;">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              class="input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="btn btn--primary" style="width: 100%;">Sign In</button>
        </form>

        <div id="result" class="alert" role="alert" style="margin-top: var(--spacing-lg); display: none;"></div>

        <p style="margin-top: var(--spacing-lg); text-align: center;">
          Don't have an account? <a href="signup.html" style="font-weight: 600;">Create one</a>
        </p>
        <p style="text-align: center;">
          <a href="index.html" style="font-weight: 600;">Back to home</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__copyright">&copy; 2026 Nessa's Fit. All rights reserved.</p>
    </div>
  </footer>

  <script src="store.js"></script>
  <script src="login.js"></script>
  <script src="script.js"></script>
</body>
</html>
